            background: linear-gradient(90deg, #e8e4dc 25%, #f0ece4 50%, #e8e4dc 75%);

            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        @media (max-width: 768px) {
            .gallery-skeleton {
                grid-template-columns: 1fr;
            }
            .skeleton-card {
                height: 300px;
            }
        }
    </style>

    <!-- JAVASCRIPT -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', function() {
            navLinks.classList.toggle('open');
        });
    </script>

    <script>
        const GALLERY_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmJ_eG_4lWnbYZ4Id9EFENpkw848NcB5lUXJrfZHIevEuYol6K7e9MU8xTiwCOCGrSChFGefANOqDd/pub?gid=1789159689&single=true&output=csv';

        function parseCSV(text) {
            const rows = [];
            const lines = text.split('\n');
            for (let i = 0; i < lines.length; i++) {
                const row = [];
                let current = '';
                let inQuotes = false;
                const line = lines[i];
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                rows.push(row);
            }
            return rows;
        }

        async function loadGallery() {
            try {
                const response = await fetch(GALLERY_SHEET_URL);
                const text = await response.text();
                const rows = parseCSV(text);
                if (rows.length < 2) return;

                const headers = rows[0].map(h => h.replace(/"/g, '').trim().toLowerCase());
                const data = rows.slice(1)
                    .filter(row => row.some(cell => cell !== ''))
                    .map(row => {
                        const obj = {};
                        headers.forEach((header, i) => {
                            obj[header] = (row[i] || '').replace(/"/g, '').trim();
                        });
                        return obj;
                    });

                const container = document.getElementById('galleryCards');
                container.innerHTML = data.map(function(item) {
                    return '<a href="gallery-details.html?collection=' + encodeURIComponent(item.collection) + '" class="gallery-page-card">' +
                        '<img src="' + item.coverimage + '" alt="' + item.collection + '" loading="lazy" style="object-position: top;">' +
                        '<div class="gallery-page-overlay">' +
                            '<span>' + item.collection + '</span>' +
                            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">' +
                                '<path d="M7 17L17 7M17 7H7M17 7V17"/>' +
                            '</svg>' +
                        '</div>' +
                    '</a>';
                }).join('');

            } catch (error) {
                console.error('Error loading gallery:', error);
            }
        }

        loadGallery();
    </script>

    <!-- LENIS SMOOTH SCROLL -->
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1,
            easing: function(t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },
            smoothTouch: false,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
    </script>
