    <!-- GOOGLE SHEETS DATA -->
    <script src="data.js"></script>
    <script>
        // Load upcoming event
        async function loadEvents() {
            const events = await fetchSheet(SHEETS.events);
            if (!events || events.length === 0) return;
            const event = events[0];

            document.getElementById('upcomingBg').style.backgroundImage = `url('${event.image}')`;

            const cardImg = document.getElementById('upcomingCardImage');
            cardImg.style.backgroundImage = `url('${event.image}')`;
            cardImg.style.width = '200px';
            cardImg.style.height = '200px';
            cardImg.style.backgroundSize = 'cover';
            cardImg.style.backgroundPosition = 'center';
            cardImg.style.display = 'block';

            document.getElementById('upcomingTitle').textContent = event.title;
            document.getElementById('upcomingTagline').textContent = event.tagline;
            document.getElementById('upcomingDate').innerHTML = event.date.toUpperCase() + '<br>' + event.time.toUpperCase();
            document.getElementById('upcomingBtn').href = event.link;
        }

        // Load past events from Gallery sheet
        async function loadPastEvents() {
            try {
                const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQmJ_eG_4lWnbYZ4Id9EFENpkw848NcB5lUXJrfZHIevEuYol6K7e9MU8xTiwCOCGrSChFGefANOqDd/pub?gid=1789159689&single=true&output=csv');
                const text = await response.text();
                const rows = text.split('\n');
                const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
                const data = rows.slice(1)
                    .filter(row => row.trim())
                    .map(row => {
                        const values = row.split(',').map(v => v.replace(/"/g, '').trim());
                        const obj = {};
                        headers.forEach((h, i) => obj[h] = values[i] || '');
                        return obj;
                    });

                const grid = document.getElementById('pastEventsGrid');
                grid.innerHTML = data.map(item => `
                    <a href="gallery-details.html?collection=${encodeURIComponent(item.collection)}" class="past-event-card past-event-bw">
                        <img src="${item.coverimage}" alt="${item.collection}" loading="lazy" style="object-position: top;">
                        <div class="past-event-overlay">
                            <span>${item.collection}</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                                <path d="M7 17L17 7M17 7H7M17 7V17"/>
                            </svg>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                console.error('Error loading past events:', error);
            }
        }

        loadEvents();
        loadPastEvents();
    </script>

    <!-- LENIS SMOOTH SCROLL -->
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothTouch: false,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
    </script>
