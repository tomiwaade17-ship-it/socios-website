    <!-- BLOG POST DATA -->
    <script>
        const BLOG_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmJ_eG_4lWnbYZ4Id9EFENpkw848NcB5lUXJrfZHIevEuYol6K7e9MU8xTiwCOCGrSChFGefANOqDd/pub?gid=722340128&single=true&output=csv';
        const BLOGDETAILS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmJ_eG_4lWnbYZ4Id9EFENpkw848NcB5lUXJrfZHIevEuYol6K7e9MU8xTiwCOCGrSChFGefANOqDd/pub?gid=1806440596&single=true&output=csv';

        // Proper CSV parser that handles quoted multi-line cells
        function parseCSVFull(text) {
            var rows = [];
            var row = [];
            var field = '';
            var inQuotes = false;
            var i = 0;

            while (i < text.length) {
                var char = text[i];

                if (inQuotes) {
                    if (char === '"') {
                        if (text[i + 1] === '"') {
                            field += '"';
                            i += 2;
                            continue;
                        } else {
                            inQuotes = false;
                            i++;
                            continue;
                        }
                    } else {
                        field += char;
                        i++;
                        continue;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                        continue;
                    } else if (char === ',') {
                        row.push(field);
                        field = '';
                        i++;
                        continue;
                    } else if (char === '\r' && text[i + 1] === '\n') {
                        row.push(field);
                        rows.push(row);
                        row = [];
                        field = '';
                        i += 2;
                        continue;
                    } else if (char === '\n') {
                        row.push(field);
                        rows.push(row);
                        row = [];
                        field = '';
                        i++;
                        continue;
                    } else {
                        field += char;
                        i++;
                        continue;
                    }
                }
            }
            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }
            return rows;
        }

        function csvRowsToObjects(rows) {
            var headers = rows[0].map(function(h) { return h.trim().toLowerCase(); });
            var objects = [];
            for (var i = 1; i < rows.length; i++) {
                var values = rows[i];
                if (!values || values.join('').trim() === '') continue;
                var obj = {};
                headers.forEach(function(h, idx) {
                    obj[h] = (values[idx] || '').trim();
                });
                objects.push(obj);
            }
            return objects;
        }

        function escapeAndLink(str) {
            str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            str = str.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
            return str;
        }

        function parseBlogBody(text) {
            text = text.replace(/\r\n/g, '\n');
            var blocks = text.split(/\n\s*\n/);
            var html = '';
            var imageRegex = /^(https?:\/\/\S+\.(jpg|jpeg|png|gif|webp))(\?\S*)?$/i;

            blocks.forEach(function(block) {
                block = block.trim();
                if (!block) return;

                if (block.indexOf('## ') === 0) {
                    html += '<h2>' + escapeAndLink(block.slice(3).trim()) + '</h2>';
                    return;
                }
                if (block.indexOf('### ') === 0) {
                    html += '<h3>' + escapeAndLink(block.slice(4).trim()) + '</h3>';
                    return;
                }
                if (imageRegex.test(block)) {
                    html += '<img class="blog-post-image" src="' + block + '" alt="">';
                    return;
                }

                var lines = block.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
                var isList = lines.length > 0 && lines.every(function(l) { return l.indexOf('- ') === 0; });
                if (isList) {
                    html += '<ul>';
                    lines.forEach(function(l) {
                        html += '<li>' + escapeAndLink(l.slice(2).trim()) + '</li>';
                    });
                    html += '</ul>';
                    return;
                }

                html += '<p>' + lines.map(escapeAndLink).join('<br>') + '</p>';
            });

            return html;
        }

        async function loadBlogPost() {
            try {
                var slug = new URLSearchParams(window.location.search).get('slug');
                if (!slug) return;

                var blogResponse = await fetch(BLOG_SHEET_URL);
                var blogRows = parseCSVFull(await blogResponse.text());
                var posts = csvRowsToObjects(blogRows);
                var post = posts.find(function(p) { return p.slug === slug; });
                if (!post) {
                    document.getElementById('postContent').innerHTML = '<p>Post not found.</p>';
                    return;
                }

                document.getElementById('pageTitle').textContent = post.title + ' — Socios';
                document.getElementById('pageDescription').setAttribute('content', post.excerpt);
                document.getElementById('postTitle').textContent = post.title;
                document.getElementById('postDate').textContent = post.date.toUpperCase();

                var coverImg = document.getElementById('postCoverImage');
                if (post.coverimage) {
                    coverImg.src = post.coverimage;
                    coverImg.alt = post.title;
                } else {
                    coverImg.style.display = 'none';
                }

                var detailsResponse = await fetch(BLOGDETAILS_SHEET_URL);
                var detailsRows = parseCSVFull(await detailsResponse.text());
                var details = csvRowsToObjects(detailsRows);
                var detail = details.find(function(d) { return d.slug === slug; });
                if (!detail || !detail.body) {
                    document.getElementById('postContent').innerHTML = '<p>Content coming soon.</p>';
                    return;
                }

                document.getElementById('postContent').innerHTML = parseBlogBody(detail.body);
            } catch (error) {
                console.error('Error loading blog post:', error);
                document.getElementById('postContent').innerHTML = '<p>There was an error loading this post.</p>';
            }
        }
        loadBlogPost();
    </script>

    <!-- LENIS SMOOTH SCROLL -->
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1,
            easing: function(t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },
            smoothTouch: false,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
    </script>

<script>
        document.body.classList.add("loaded");
        document.querySelectorAll("a").forEach(function(link) {
            link.addEventListener("click", function(e) {
                var href = this.getAttribute("href");
                if (href && !href.startsWith("#") && !href.startsWith("mailto") && !href.startsWith("http") && !href.startsWith("tel")) {
                    e.preventDefault();
                    document.body.classList.remove("loaded");
                    var target = href;
                    setTimeout(function() { window.location.href = target; }, 300);
                }
            });
        });
    </script>
