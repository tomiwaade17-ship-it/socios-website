    <script>
        const GALLERY_SHEETS = {
            gallery: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmJ_eG_4lWnbYZ4Id9EFENpkw848NcB5lUXJrfZHIevEuYol6K7e9MU8xTiwCOCGrSChFGefANOqDd/pub?gid=1789159689&single=true&output=csv',
            galleryDetails: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmJ_eG_4lWnbYZ4Id9EFENpkw848NcB5lUXJrfZHIevEuYol6K7e9MU8xTiwCOCGrSChFGefANOqDd/pub?gid=30924486&single=true&output=csv'
        };

        function parseCSV(text) {
            const rows = [];
            const lines = text.split('\n');
            for (let i = 0; i < lines.length; i++) {
                const row = [];
                let current = '';
                let inQuotes = false;
                const line = lines[i];
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                rows.push(row);
            }
            return rows;
        }

        async function fetchGallerySheet(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const rows = parseCSV(text);
                if (rows.length < 2) return [];
                const headers = rows[0].map(h => h.replace(/"/g, '').trim().toLowerCase());
                const data = rows.slice(1)
                    .filter(row => row.some(cell => cell !== ''))
                    .map(row => {
                        const obj = {};
                        headers.forEach((header, i) => {
                            obj[header] = (row[i] || '').replace(/"/g, '').trim();
                        });
                        return obj;
                    });
                return data;
            } catch (error) {
                console.error('Error fetching sheet:', error);
                return [];
            }
        }

        async function loadGalleryDetails() {
            const params = new URLSearchParams(window.location.search);
            const collection = params.get('collection');
            if (!collection) return;

            // Set title immediately from URL param — no flash
            document.getElementById('galleryTitle').textContent = collection;
            document.title = collection + ' — Socios';

            const galleries = await fetchGallerySheet(GALLERY_SHEETS.gallery);
            const match = galleries.find(g => g.collection === collection);

            if (match) {
                if (match.link) {
                    document.getElementById('galleryExternalLink').href = match.link;
                }
                if (match.coverimage) {
                    const heroImg = document.getElementById('galleryHeroImg');
                    heroImg.src = match.coverimage;
                    heroImg.alt = collection;
                    heroImg.onload = () => heroImg.classList.add('loaded');
                    // In case image already cached
                    if (heroImg.complete) heroImg.classList.add('loaded');
                }
            }

            const details = await fetchGallerySheet(GALLERY_SHEETS.galleryDetails);
            const images = details.filter(d => d.collection === collection);
            const grid = document.getElementById('galleryGrid');
            if (images.length) {
                grid.innerHTML = images.map((img, i) => `
                    <div class="gallery-details-item ${i === 1 ? 'tall' : ''}">
                        <img src="${img.image}" alt="${collection}" loading="lazy" style="object-position: top;">
                    </div>
                `).join('');
            }
        }

        loadGalleryDetails();
    </script>

    <!-- LENIS SMOOTH SCROLL -->
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothTouch: false,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
    </script>

<script>
        document.body.classList.add("loaded");
        document.querySelectorAll("a").forEach(function(link) {
            link.addEventListener("click", function(e) {
                var href = this.getAttribute("href");
                if (href && !href.startsWith("#") && !href.startsWith("mailto") && !href.startsWith("http") && !href.startsWith("tel")) {
                    e.preventDefault();
                    document.body.classList.remove("loaded");
                    var target = href;
                    setTimeout(function() { window.location.href = target; }, 300);
                }
            });
        });
    </script>
